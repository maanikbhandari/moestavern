<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Draft Ownership Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto 40px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.95;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .controls {
            max-width: 1200px;
            margin: 0 auto 30px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .search-box {
            position: relative;
        }
        
        #search {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s;
        }
        
        #search:focus {
            outline: none;
            border-color: #2a5298;
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 20px;
        }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #2a5298;
            background: white;
            color: #2a5298;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: #2a5298;
            color: white;
        }
        
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .player-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .player-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .player-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .player-info {
            padding: 15px;
        }
        
        .player-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 5px;
        }
        
        .player-stats {
            color: #666;
            font-size: 0.9em;
        }
        
        .no-results {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 60px 20px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            padding: 20px;
            overflow: auto;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .modal-image {
            width: 100%;
            height: auto;
        }
        
        .modal-details {
            padding: 30px;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            transition: background 0.3s;
        }
        
        .close-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🏒 NHL Draft Ownership Gallery</h1>
        <p class="subtitle">Explore which league members drafted your favorite players</p>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="totalPlayers">-</div>
                <div class="stat-label">Players</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalDrafts">-</div>
                <div class="stat-label">Total Drafts</div>
            </div>
        </div>
    </header>
    
    <div class="controls">
        <div class="search-box">
            <input type="text" id="search" placeholder="Search players...">
            <span class="search-icon">🔍</span>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Players</button>
            <button class="filter-btn" data-filter="5+">5+ Drafts</button>
            <button class="filter-btn" data-filter="7+">7+ Drafts</button>
            <button class="filter-btn" data-filter="10+">10+ Drafts</button>
        </div>
    </div>
    
    <div class="gallery" id="gallery"></div>
    <div class="no-results" id="noResults" style="display: none;">
        No players found matching your search
    </div>
    
    <div class="modal" id="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-details" id="modalDetails"></div>
        </div>
    </div>
    
    <script>
        let allPlayers = [];
        let currentFilter = 'all';
        
        // Load player data
        fetch('players.json')
            .then(response => response.json())
            .then(data => {
                allPlayers = data;
                updateStats();
                displayPlayers(allPlayers);
            });
        
        function updateStats() {
            document.getElementById('totalPlayers').textContent = allPlayers.length;
            const totalDrafts = allPlayers.reduce((sum, p) => sum + p.total_drafts, 0);
            document.getElementById('totalDrafts').textContent = totalDrafts;
        }
        
        function displayPlayers(players) {
            const gallery = document.getElementById('gallery');
            const noResults = document.getElementById('noResults');
            
            if (players.length === 0) {
                gallery.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            gallery.innerHTML = players.map(player => `
                <div class="player-card" onclick="openModal('${player.name}')">
                    <img src="${player.image}" alt="${player.name}">
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                        <div class="player-stats">
                            ${player.total_drafts} drafts • ${player.unique_owners} owners
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function filterPlayers() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            
            let filtered = allPlayers.filter(p => 
                p.name.toLowerCase().includes(searchTerm)
            );
            
            // Apply draft count filter
            if (currentFilter === '5+') {
                filtered = filtered.filter(p => p.total_drafts >= 5);
            } else if (currentFilter === '7+') {
                filtered = filtered.filter(p => p.total_drafts >= 7);
            } else if (currentFilter === '10+') {
                filtered = filtered.filter(p => p.total_drafts >= 10);
            }
            
            displayPlayers(filtered);
        }
        
        // Search functionality
        document.getElementById('search').addEventListener('input', filterPlayers);
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                filterPlayers();
            });
        });
        
        // Modal functions
        function openModal(playerName) {
            const player = allPlayers.find(p => p.name === playerName);
            if (!player) return;
            
            document.getElementById('modalImage').src = player.image;
            
            const ownersList = Object.entries(player.owners)
                .sort((a, b) => b[1] - a[1])
                .map(([owner, count]) => `<li><strong>${owner}</strong>: ${count} time${count > 1 ? 's' : ''}</li>`)
                .join('');
            
            document.getElementById('modalDetails').innerHTML = `
                <h2>${player.name}</h2>
                <p style="color: #666; margin-bottom: 20px;">
                    Team: ${player.team} • ${player.total_drafts} total drafts • ${player.unique_owners} unique owners
                </p>
                <h3 style="margin-bottom: 10px;">Draft History:</h3>
                <ul style="line-height: 1.8;">
                    ${ownersList}
                </ul>
            `;
            
            document.getElementById('modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Close modal on background click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
