<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moe's Tavern - NHL Draft Player Statistics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 20px 40px;
        }

        .header-image {
            max-width: 200px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .header-image:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-label {
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .stats {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .player-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .player-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .player-team {
            font-size: 12px;
            color: #7c3aed;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .player-stats {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            font-weight: 600;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #7c3aed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 90%;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }

        .modal-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #dc2626;
            transform: rotate(90deg);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 24px;
            padding: 40px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 20px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }

            .filters {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://moestavern.netlify.app/img/moe.536cea6c.webp" 
                 alt="Moe's Tavern" 
                 class="header-image" 
                 id="headerImage"
                 onclick="toggleMoeImage()">
            <h1>Moe's Tavern</h1>
            <div class="subtitle">Welcome to Moe's Tavern.</div>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search for a player...">
            
            <div class="filter-section">
                <span class="filter-label">Number of Drafts</span>
                <div class="filters" id="draftsFilters"></div>
            </div>

            <div class="filter-section">
                <span class="filter-label">Number of Owners</span>
                <div class="filters" id="ownersFilters"></div>
            </div>

            <div class="filter-section">
                <span class="filter-label">By Owner</span>
                <div class="filters" id="ownerFilters"></div>
            </div>

            <div class="filter-section">
                <span class="filter-label">By NHL Team</span>
                <div class="filters" id="teamFilters"></div>
            </div>
        </div>

        <div class="stats" id="statsDisplay"></div>

        <div class="loading" id="loading">Loading player data...</div>

        <div class="grid" id="playerGrid"></div>

        <div class="no-results" id="noResults" style="display: none;">
            No players found matching your criteria.
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>

    <script>
        let allPlayers = [];
        let currentDraftsFilter = 'all';
        let currentOwnersFilter = 'all';
        let currentOwnerFilter = 'all';
        let currentTeamFilter = 'all';
        let searchTerm = '';

        // Toggle Moe image
        let moeImageToggled = false;
        function toggleMoeImage() {
            const img = document.getElementById('headerImage');
            if (moeImageToggled) {
                img.src = 'https://moestavern.netlify.app/img/moe.536cea6c.webp';
            } else {
                img.src = 'https://moestavern.netlify.app/img/moe.465c974b.png';
            }
            moeImageToggled = !moeImageToggled;
        }

        // Fetch player data
        fetch('players.json')
            .then(response => response.json())
            .then(data => {
                allPlayers = data; // data is already an array
                document.getElementById('loading').style.display = 'none';
                generateFilters();
                renderPlayers();
            })
            .catch(error => {
                document.getElementById('loading').textContent = 'Error loading player data.';
                console.error('Error:', error);
            });

        // Generate dynamic filters
        function generateFilters() {
            // Get unique values
            const draftCounts = [...new Set(allPlayers.map(p => p.total_drafts))].sort((a, b) => a - b);
            const ownerCounts = [...new Set(allPlayers.map(p => p.unique_owners))].sort((a, b) => a - b);
            const allOwners = [...new Set(allPlayers.flatMap(p => Object.keys(p.owners)))].sort();
            const allTeams = [...new Set(allPlayers.map(p => p.team).filter(t => t && t !== 'Unknown'))].sort();

            // Drafts filters
            const draftsContainer = document.getElementById('draftsFilters');
            draftsContainer.innerHTML = '<button class="filter-btn active" data-type="drafts" data-value="all">All</button>';
            draftCounts.forEach(count => {
                draftsContainer.innerHTML += `<button class="filter-btn" data-type="drafts" data-value="${count}">${count}+ Drafts</button>`;
            });

            // Owners count filters
            const ownersContainer = document.getElementById('ownersFilters');
            ownersContainer.innerHTML = '<button class="filter-btn active" data-type="owners-count" data-value="all">All</button>';
            ownerCounts.forEach(count => {
                ownersContainer.innerHTML += `<button class="filter-btn" data-type="owners-count" data-value="${count}">${count}+ Owners</button>`;
            });

            // Owner filters
            const ownerContainer = document.getElementById('ownerFilters');
            ownerContainer.innerHTML = '<button class="filter-btn active" data-type="owner" data-value="all">All Owners</button>';
            allOwners.forEach(owner => {
                ownerContainer.innerHTML += `<button class="filter-btn" data-type="owner" data-value="${owner}">${owner}</button>`;
            });

            // Team filters
            const teamContainer = document.getElementById('teamFilters');
            teamContainer.innerHTML = '<button class="filter-btn active" data-type="team" data-value="all">All Teams</button>';
            allTeams.forEach(team => {
                teamContainer.innerHTML += `<button class="filter-btn" data-type="team" data-value="${team}">${team}</button>`;
            });

            // Add event listeners
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', handleFilterClick);
            });
        }

        // Handle filter clicks
        function handleFilterClick(e) {
            const type = e.target.dataset.type;
            const value = e.target.dataset.value;

            // Update active state for this filter type
            const container = e.target.parentElement;
            container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            // Update filter state
            if (type === 'drafts') currentDraftsFilter = value;
            else if (type === 'owners-count') currentOwnersFilter = value;
            else if (type === 'owner') currentOwnerFilter = value;
            else if (type === 'team') currentTeamFilter = value;

            renderPlayers();
        }

        // Search box
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase();
            renderPlayers();
        });

        // Render players based on filters
        function renderPlayers() {
            const grid = document.getElementById('playerGrid');
            const noResults = document.getElementById('noResults');
            
            let filtered = allPlayers.filter(player => {
                // Search filter
                if (searchTerm && !player.name.toLowerCase().includes(searchTerm)) {
                    return false;
                }

                // Drafts filter
                if (currentDraftsFilter !== 'all' && player.total_drafts < parseInt(currentDraftsFilter)) {
                    return false;
                }

                // Owners count filter
                if (currentOwnersFilter !== 'all' && player.unique_owners < parseInt(currentOwnersFilter)) {
                    return false;
                }

                // Specific owner filter
                if (currentOwnerFilter !== 'all' && !player.owners[currentOwnerFilter]) {
                    return false;
                }

                // Team filter
                if (currentTeamFilter !== 'all' && player.team !== currentTeamFilter) {
                    return false;
                }

                return true;
            });

            // Update stats
            document.getElementById('statsDisplay').textContent = 
                `Showing ${filtered.length} of ${allPlayers.length} players`;

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            // Sort by drafts descending
            filtered.sort((a, b) => b.total_drafts - a.total_drafts);

            grid.innerHTML = filtered.map(player => `
                <div class="player-card" onclick="showModal('${player.image}', '${player.name}')">
                    <div class="player-name">${player.name}</div>
                    <div class="player-team">${player.team || 'Unknown'}</div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <span class="stat-label">Drafts</span>
                            <span class="stat-value">${player.total_drafts}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Owners</span>
                            <span class="stat-value">${player.unique_owners}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Modal functionality
        function showModal(imagePath, playerName) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imagePath;
            modalImage.alt = playerName;
            modal.classList.add('active');
        }

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        });

        // Keyboard shortcut to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('modal').classList.remove('active');
            }
        });
    </script>
</body>
</html>
