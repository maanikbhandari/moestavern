<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moe's Tavern - NHL Draft Player Statistics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 20px 40px;
        }

        .header-image {
            max-width: 200px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 10px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .stats {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .player-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .player-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .player-stats {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            font-weight: 600;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #7c3aed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 90%;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }

        .modal-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #dc2626;
            transform: rotate(90deg);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 24px;
            padding: 40px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 20px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }

            .filters {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://moestavern.netlify.app/img/moe.536cea6c.webp" alt="Moe's Tavern" class="header-image">
            <h1>Moe's Tavern</h1>
            <div class="subtitle">Welcome to Moe's Tavern.</div>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search for a player...">
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Players</button>
                <button class="filter-btn" data-filter="2">2+ Drafts</button>
                <button class="filter-btn" data-filter="3">3+ Drafts</button>
                <button class="filter-btn" data-filter="5">5+ Drafts</button>
                <button class="filter-btn" data-filter="7">7+ Drafts</button>
                <button class="filter-btn" data-filter="10">10+ Drafts</button>
                <button class="filter-btn" data-filter="owners-3">3+ Owners</button>
                <button class="filter-btn" data-filter="owners-5">5+ Owners</button>
            </div>
        </div>

        <div class="stats" id="statsDisplay"></div>

        <div class="loading" id="loading">Loading player data...</div>

        <div class="grid" id="playerGrid"></div>

        <div class="no-results" id="noResults" style="display: none;">
            No players found matching your criteria.
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>

    <script>
        let allPlayers = [];
        let currentFilter = 'all';
        let searchTerm = '';

        // Fetch player data
        fetch('players.json')
            .then(response => response.json())
            .then(data => {
                allPlayers = data.players;
                document.getElementById('loading').style.display = 'none';
                renderPlayers();
            })
            .catch(error => {
                document.getElementById('loading').textContent = 'Error loading player data.';
                console.error('Error:', error);
            });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderPlayers();
            });
        });

        // Search box
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase();
            renderPlayers();
        });

        // Render players based on filters
        function renderPlayers() {
            const grid = document.getElementById('playerGrid');
            const noResults = document.getElementById('noResults');
            
            let filtered = allPlayers.filter(player => {
                // Search filter
                if (searchTerm && !player.name.toLowerCase().includes(searchTerm)) {
                    return false;
                }

                // Draft/Owner count filters
                if (currentFilter === 'all') return true;
                if (currentFilter.startsWith('owners-')) {
                    const minOwners = parseInt(currentFilter.split('-')[1]);
                    return player.owners >= minOwners;
                }
                const minDrafts = parseInt(currentFilter);
                return player.drafts >= minDrafts;
            });

            // Update stats
            document.getElementById('statsDisplay').textContent = 
                `Showing ${filtered.length} of ${allPlayers.length} players`;

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            // Sort by drafts descending
            filtered.sort((a, b) => b.drafts - a.drafts);

            grid.innerHTML = filtered.map(player => `
                <div class="player-card" onclick="showModal('${player.image}', '${player.name}')">
                    <div class="player-name">${player.name}</div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <span class="stat-label">Drafts</span>
                            <span class="stat-value">${player.drafts}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Owners</span>
                            <span class="stat-value">${player.owners}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Modal functionality
        function showModal(imagePath, playerName) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = 'images/' + imagePath;
            modalImage.alt = playerName;
            modal.classList.add('active');
        }

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        });

        // Keyboard shortcut to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('modal').classList.remove('active');
            }
        });
    </script>
</body>
</html>
