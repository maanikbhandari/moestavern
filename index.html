<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moe's Tavern - NHL Draft Player Statistics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 20px 40px;
        }

        .header-image {
            max-width: 200px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .header-image:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .filter-section {
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        .filter-header {
            font-weight: 700;
            color: #374151;
            padding: 12px 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #f9fafb;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .filter-header:hover {
            background: #f3f4f6;
        }

        .filter-header::after {
            content: '▼';
            font-size: 12px;
            transition: transform 0.3s;
        }

        .filter-header.collapsed::after {
            transform: rotate(-90deg);
        }

        .filter-content {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;
            transition: max-height 0.3s ease-out;
        }

        .filter-content.collapsed {
            max-height: 0;
            overflow: hidden;
        }

        .filter-label {
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px;
        }

        .filter-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .stats {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .player-card {
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            perspective: 1000px;
        }

        .player-card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.6s, height 0.3s ease;
            transform-style: preserve-3d;
        }

        .player-card.flipped .player-card-inner {
            transform: rotateY(180deg);
        }

        .player-card-front,
        .player-card-back {
            width: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 180px;
        }

        .player-card-front {
            padding-bottom: 25px;
        }

        .player-card:hover .player-card-front,
        .player-card:hover .player-card-back {
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .player-card-back {
            transform: rotateY(180deg);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .championship-triangle {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top-right-radius: 12px;
            border-style: solid;
            border-width: 0 60px 60px 0;
            border-color: transparent #ffd700 transparent transparent;
            z-index: 10;
            cursor: pointer;
            transition: filter 0.3s;
        }

        .championship-triangle:hover {
            filter: brightness(1.2);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        .player-headshot {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #7c3aed;
            background: #f1f5f9;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
            padding-right: 20px; /* Added padding to prevent overlap with triangle */
        }

        .player-team {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .team-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .player-stats {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 14px;
            margin-top: auto;
            padding-top: 8px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            font-weight: 600;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #7c3aed;
        }

        .championship-back-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .championship-list {
            flex: 1;
            overflow-y: auto;
        }

        .championship-item {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #ffd700;
        }

        .championship-season {
            font-size: 14px;
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: 4px;
        }

        .championship-detail {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 2px;
        }

        .flip-instruction {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 10px;
            color: #94a3b8;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 95%;
            max-height: 95vh;
            overflow: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .modal-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            width: 100%;
            position: relative;
        }

        .modal-image {
            max-width: 100%;
            max-height: calc(95vh - 200px);
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.15s ease;
        }

        .modal-nav-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .close-btn:hover {
            background: #dc2626;
            transform: rotate(90deg);
        }

        .nav-btn {
            background: rgba(124, 58, 237, 0.9);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: rgba(124, 58, 237, 1);
            transform: scale(1.1);
        }

        .image-indicator {
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator-dot.active {
            background: rgba(124, 58, 237, 1);
            transform: scale(1.3);
        }

        .indicator-dot:hover {
            background: rgba(124, 58, 237, 0.7);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 24px;
            padding: 40px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 20px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }

            .filters {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="img/moe.webp" 
                 alt="Moe's Tavern" 
                 class="header-image" 
                 id="headerImage"
                 onclick="toggleMoeImage()">
            <h1>Moe's Tavern</h1>
            <div class="subtitle">Welcome to Moe's Tavern.</div>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search for a player...">
            
            <div class="filter-section">
                <div class="filter-header" onclick="toggleFilter(this)">
                    📊 Total Drafts (All Owners)
                </div>
                <div class="filter-content">
                    <div class="filters" id="draftsFilters"></div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-header collapsed" onclick="toggleFilter(this)">
                    👥 Total Unique Owners
                </div>
                <div class="filter-content collapsed">
                    <div class="filters" id="ownersFilters"></div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-header collapsed" onclick="toggleFilter(this)">
                    🏒 By NHL Team
                </div>
                <div class="filter-content collapsed">
                    <div class="filters" id="teamFilters"></div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-header collapsed" onclick="toggleFilter(this)">
                    👤 Filter by Specific Owner
                </div>
                <div class="filter-content collapsed">
                    <div class="filters" id="ownerFilters"></div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-header collapsed" onclick="toggleFilter(this)">
                    ↳ How Many Times? (Requires Owner Selected)
                </div>
                <div class="filter-content collapsed">
                    <div class="filters" id="ownerDraftCountFilters"></div>
                </div>
            </div>
                <div class="filter-section">
                    <div class="filter-header collapsed" onclick="toggleFilter(this)">
                        🏆 Championship Wins
                    </div>
                    <div class="filter-content collapsed">
                        <div class="filters" id="championshipWinsFilter"></div>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-header collapsed" onclick="toggleFilter(this)">
                        🥅 By Position
                    </div>
                    <div class="filter-content collapsed">
                        <div class="filters" id="positionFilters">
                            <button class="filter-btn active" data-type="position" data-value="all">All</button>
                            <button class="filter-btn" data-type="position" data-value="F">F</button>
                            <button class="filter-btn" data-type="position" data-value="D">D</button>
                            <button class="filter-btn" data-type="position" data-value="G">G</button>
                        </div>
                    </div>
                </div>
        </div>

        <div class="stats" id="statsDisplay"></div>

        <div class="loading" id="loading">Loading player data...</div>

        <div class="grid" id="playerGrid"></div>

        <div class="no-results" id="noResults" style="display: none;">
            No players found matching your criteria.
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <div class="modal-image-container">
                <img id="modalImage" class="modal-image" src="" alt="">
            </div>
            <div class="modal-nav-controls">
                <button class="nav-btn prev" id="prevImage">&#8249;</button>
                <div class="image-indicator" id="imageIndicator">
                    <div class="indicator-dot" data-index="0"></div>
                    <div class="indicator-dot" data-index="1"></div>
                    <div class="indicator-dot" data-index="2"></div>
                </div>
                <button class="nav-btn next" id="nextImage">&#8250;</button>
            </div>
        </div>
    </div>

    <script>
        let allPlayers = [];
    let filteredPlayers = [];  // Store current filtered results
    let currentDraftsFilter = '2';  // Default to 2+ drafts
    let currentOwnersFilter = 'all';
    let currentOwnerFilter = 'all';
    let currentOwnerDraftCountFilter = 'all';  // New filter
    let currentTeamFilter = 'all';
    let currentChampionshipWinsFilter = 'all';
    let currentPositionFilter = 'all';
    let championshipWinsOptions = [];
    let searchTerm = '';
    
    // Cache parsed values (initialize drafts to 2 to match default filter)
    let cachedDraftsValue = 2;
    let cachedOwnersValue = null;
    let cachedOwnerDraftCountValue = null;

        // Normalize team abbreviations for NHL logo API
        const teamLogoMap = {
            'LA': 'LAK',
            'NJ': 'NJD',
            'SJ': 'SJS',
            'TB': 'TBL',
            'Buf': 'BUF',
            'Chi': 'CHI',
            'Det': 'DET',
            'Fla': 'FLA',
            'Nsh': 'NSH',
            'Pit': 'PIT',
            'Sea': 'SEA',
            'StL': 'STL',
            'Tor': 'TOR',
            'Van': 'VAN',
            'Vgs': 'VGK'
        };

        function getTeamLogo(teamAbbr) {
            if (!teamAbbr || teamAbbr === 'Unknown') return null;
            
            // Normalize the abbreviation
            const normalizedTeam = teamLogoMap[teamAbbr] || teamAbbr.toUpperCase();
            
            return `https://assets.nhle.com/logos/nhl/svg/${normalizedTeam}_light.svg`;
        }

        // Toggle filter section collapse
        function toggleFilter(header) {
            const content = header.nextElementSibling;
            header.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
        }

        // Toggle Moe image
        let moeImageToggled = false;
        function toggleMoeImage() {
            const img = document.getElementById('headerImage');
            if (moeImageToggled) {
                img.src = 'img/moe.webp';
            } else {
                img.src = 'img/moe_alt.png';
            }
            moeImageToggled = !moeImageToggled;
        }

        // Get random Will Smith image (for player Will Smith)
        function getWillSmithImage() {
            const willSmithImages = [
                'img/will-smith-1.jpg',
                'img/will-smith-2.jpg',
                'img/will-smith-3.jpg'
            ];
            const randomIndex = Math.floor(Math.random() * willSmithImages.length);
            return willSmithImages[randomIndex];
        }

        // Get player headshot URL
        function getPlayerHeadshot(player) {
            // Special case for Will Smith - 50% official, 50% split among 3 custom images
            if (player.name === 'Will Smith') {
                const rand = Math.random();
                if (rand < 0.5) {
                    // 50% chance: use official NHL headshot
                    return player.player_id ? `https://assets.nhle.com/mugs/nhl/latest/${player.player_id}.png` : '';
                } else {
                    // 50% chance split among 3 custom images (~16.67% each)
                    return getWillSmithImage();
                }
            }
            // Special case for Roope Hintz - 75% official, 25% easter egg GIF
            if (player.name === 'Roope Hintz') {
                const rand = Math.random();
                if (rand < 0.25) {
                    // 25% chance: use custom GIF
                    return 'img/roope-hintz-1.gif';
                }
                // 75% chance: use official NHL headshot (fall through to default)
            }
            // Default NHL headshot
            return player.player_id ? `https://assets.nhle.com/mugs/nhl/latest/${player.player_id}.png` : null;
        }

        // Fetch player data
        fetch('players.json')
            .then(response => response.json())
            .then(data => {
                allPlayers = data; // data is already an array
                document.getElementById('loading').style.display = 'none';
                generateFilters();
                renderPlayers();
            })
            .catch(error => {
                document.getElementById('loading').textContent = 'Error loading player data.';
                console.error('Error:', error);
            });

        // Generate dynamic filters
        function generateFilters() {
            // Get unique values
            const draftCounts = [...new Set(allPlayers.map(p => p.total_drafts))].sort((a, b) => a - b);
            const ownerCounts = [...new Set(allPlayers.map(p => p.unique_owners))].sort((a, b) => a - b);
            const allOwners = [...new Set(allPlayers.flatMap(p => Object.keys(p.owners)))].sort();
            const allTeams = [...new Set(allPlayers.map(p => p.team).filter(t => t && t !== 'Unknown'))].sort();

            // Drafts filters
            const draftsContainer = document.getElementById('draftsFilters');
            draftsContainer.innerHTML = '<button class="filter-btn" data-type="drafts" data-value="all">All</button>';
            draftCounts.forEach(count => {
                const isActive = count === 2 ? ' active' : '';
                draftsContainer.innerHTML += `<button class="filter-btn${isActive}" data-type="drafts" data-value="${count}">${count}+ Drafts</button>`;
            });

            // Owners count filters
            const ownersContainer = document.getElementById('ownersFilters');
            ownersContainer.innerHTML = '<button class="filter-btn active" data-type="owners-count" data-value="all">All</button>';
            ownerCounts.forEach(count => {
                ownersContainer.innerHTML += `<button class="filter-btn" data-type="owners-count" data-value="${count}">${count} Owner${count > 1 ? 's' : ''}</button>`;
            });

            // Owner filters
            const ownerContainer = document.getElementById('ownerFilters');
            ownerContainer.innerHTML = '<button class="filter-btn active" data-type="owner" data-value="all">All Owners</button>';
            allOwners.forEach(owner => {
                ownerContainer.innerHTML += `<button class="filter-btn" data-type="owner" data-value="${owner}">${owner}</button>`;
            });

            // Owner draft count filters (initially showing "Select an owner first")
            const ownerDraftCountContainer = document.getElementById('ownerDraftCountFilters');
            ownerDraftCountContainer.innerHTML = '<button class="filter-btn active" data-type="owner-draft-count" data-value="all">All</button>';
            ownerDraftCountContainer.innerHTML += '<div style="color: #888; padding: 8px; font-size: 0.9em;">Select an owner to filter by draft count</div>';

            // Team filters
            const teamContainer = document.getElementById('teamFilters');
            teamContainer.innerHTML = '<button class="filter-btn active" data-type="team" data-value="all">All Teams</button>';
            allTeams.forEach(team => {
                const logoUrl = getTeamLogo(team);
                teamContainer.innerHTML += `<button class="filter-btn" data-type="team" data-value="${team}">
                    ${logoUrl ? `<img src="${logoUrl}" class="team-logo" style="vertical-align: middle; margin-right: 6px;" alt="${team}">` : ''}
                    ${team.toUpperCase()}
                </button>`;
            });

            // Generate championship wins filter buttons dynamically
            const winsSet = new Set(allPlayers.map(p => p.championship_wins || 0));
            championshipWinsOptions = Array.from(winsSet).sort((a, b) => a - b);
            const winsFilterDiv = document.getElementById('championshipWinsFilter');
            winsFilterDiv.innerHTML = '';
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.dataset.type = 'championship-wins';
            allBtn.dataset.value = 'all';
            allBtn.textContent = 'All';
            winsFilterDiv.appendChild(allBtn);
            championshipWinsOptions.forEach(wins => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.type = 'championship-wins';
                btn.dataset.value = wins;
                btn.textContent = wins;
                winsFilterDiv.appendChild(btn);
            });

            // Re-attach event listeners for all filter buttons (not just championship wins)
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.removeEventListener('click', handleFilterClick);
                btn.addEventListener('click', handleFilterClick);
            });
        }

        // Handle filter clicks
        function handleFilterClick(e) {
            const type = e.target.dataset.type;
            const value = e.target.dataset.value;

            // Update active state for this filter type
            const container = e.target.parentElement;
            container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            // Update filter state and cache parsed values
            if (type === 'drafts') {
                currentDraftsFilter = value;
                cachedDraftsValue = value === 'all' ? null : parseInt(value);
            }
            else if (type === 'owners-count') {
                currentOwnersFilter = value;
                cachedOwnersValue = value === 'all' ? null : parseInt(value);
            }
            else if (type === 'owner') {
                currentOwnerFilter = value;
                updateOwnerDraftCountFilters(value);
            }
            else if (type === 'owner-draft-count') {
                currentOwnerDraftCountFilter = value;
                cachedOwnerDraftCountValue = value === 'all' ? null : parseInt(value);
            }
            else if (type === 'team') currentTeamFilter = value;
            else if (type === 'championship-wins') currentChampionshipWinsFilter = value;
            else if (type === 'position') currentPositionFilter = value;

            // Update active button styling for championship wins filter
            if (type === 'championship-wins') {
                document.querySelectorAll('#championshipWinsFilter .filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                e.target.classList.add('active');
            }

            renderPlayers();
        }

        // Update owner draft count filters when an owner is selected
        function updateOwnerDraftCountFilters(owner) {
            const container = document.getElementById('ownerDraftCountFilters');
            
            if (owner === 'all') {
                // Reset to default message
                container.innerHTML = '<button class="filter-btn active" data-type="owner-draft-count" data-value="all">All</button>';
                container.innerHTML += '<div style="color: #888; padding: 8px; font-size: 0.9em;">Select an owner to filter by draft count</div>';
                currentOwnerDraftCountFilter = 'all';
            } else {
                // Get all draft counts for this owner
                const draftCounts = new Set();
                allPlayers.forEach(player => {
                    if (player.owners[owner]) {
                        draftCounts.add(player.owners[owner]);
                    }
                });
                
                const sortedCounts = [...draftCounts].sort((a, b) => a - b);
                
                container.innerHTML = '<button class="filter-btn active" data-type="owner-draft-count" data-value="all">All</button>';
                sortedCounts.forEach(count => {
                    const label = count === 1 ? '1 time' : `${count} times`;
                    container.innerHTML += `<button class="filter-btn" data-type="owner-draft-count" data-value="${count}">${label}</button>`;
                });
                
                currentOwnerDraftCountFilter = 'all';
            }
            
            // Re-attach event listeners
            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', handleFilterClick);
            });
        }

        // Search box with debouncing
        let searchTimeout;
        document.getElementById('searchBox').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchTerm = e.target.value.toLowerCase();
                renderPlayers();
            }, 300);
        });

        // Render players based on filters
        function renderPlayers() {
            const grid = document.getElementById('playerGrid');
            const noResults = document.getElementById('noResults');
            
            let filtered = allPlayers.filter(player => {
                // Search filter
                if (searchTerm && !player.name.toLowerCase().includes(searchTerm)) {
                    return false;
                }

                // Drafts filter (use cached value)
                if (cachedDraftsValue !== null && player.total_drafts < cachedDraftsValue) {
                    return false;
                }

                // Owners count filter (use cached value)
                if (cachedOwnersValue !== null && player.unique_owners !== cachedOwnersValue) {
                    return false;
                }

                // Specific owner filter
                if (currentOwnerFilter !== 'all' && !player.owners[currentOwnerFilter]) {
                    return false;
                }

                // Owner draft count filter (use cached value)
                if (cachedOwnerDraftCountValue !== null && currentOwnerFilter !== 'all') {
                    const draftCount = player.owners[currentOwnerFilter] || 0;
                    if (draftCount !== cachedOwnerDraftCountValue) {
                        return false;
                    }
                }

                // Team filter
                if (currentTeamFilter !== 'all' && player.team !== currentTeamFilter) {
                    return false;
                }

                // Championship wins filter
                if (currentChampionshipWinsFilter !== 'all' && (player.championship_wins || 0).toString() !== currentChampionshipWinsFilter) {
                    return false;
                }

                // Position filter
                if (currentPositionFilter !== 'all') {
                    const positions = player.position || [];
                    if (currentPositionFilter === 'F') {
                        // Forwards: C, RW, LW
                        const hasForwardPosition = positions.some(pos => ['C', 'RW', 'LW'].includes(pos));
                        if (!hasForwardPosition) return false;
                    } else if (currentPositionFilter === 'D') {
                        // Defense
                        if (!positions.includes('D')) return false;
                    } else if (currentPositionFilter === 'G') {
                        // Goalie
                        if (!positions.includes('G')) return false;
                    }
                }

                return true;
            });

            // Update stats
            document.getElementById('statsDisplay').textContent = 
                `Showing ${filtered.length} of ${allPlayers.length} players`;

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            // Sort by drafts descending
            filtered.sort((a, b) => b.total_drafts - a.total_drafts);

            // Store filtered results for modal access
            filteredPlayers = filtered;

            // Use DocumentFragment for better performance
            const fragment = document.createDocumentFragment();
            const tempDiv = document.createElement('div');
            
            tempDiv.innerHTML = filtered.map((player, index) => {
                // Build championship details for back of card
                let championshipHTML = '';
                if (player.championship_wins && player.championship_wins > 0) {
                    const championships = [];
                    if (player.championship_season && Array.isArray(player.championship_season)) {
                        player.championship_season.forEach((season, i) => {
                            // Format season as 'YYYY-YYYY' if it's 8 digits
                            let formattedSeason = season;
                            if (/^\d{8}$/.test(season)) {
                                formattedSeason = season.slice(0,4) + '-' + season.slice(4);
                            }
                                // Check for trade condition
                                let traded_from = null;
                                if (player.owner_years) {
                                    const champ_owner = player.championship_owner && player.championship_owner[i] ? player.championship_owner[i] : null;
                                    const champ_season = player.championship_season[i];
                                    if (champ_owner && (!player.owner_years[champ_owner] || !player.owner_years[champ_owner].includes(champ_season))) {
                                        // Find another owner who has this season
                                        for (const [other_owner, years] of Object.entries(player.owner_years)) {
                                            if (other_owner !== champ_owner && years.includes(champ_season)) {
                                                traded_from = other_owner;
                                                break;
                                            }
                                        }
                                    }
                                }
                                championships.push({
                                    season: formattedSeason,
                                    team: player.championship_team && player.championship_team[i] ? player.championship_team[i] : 'Unknown',
                                    owner: player.championship_owner && player.championship_owner[i] ? player.championship_owner[i] : 'Unknown',
                                    draft_pick: player.championship_draft_pick && player.championship_draft_pick[i] ? player.championship_draft_pick[i] : 'Unknown',
                                    round: player.championship_round && player.championship_round[i] ? player.championship_round[i] : 'Unknown',
                                    traded_from: traded_from
                                });
                        });
                    }
                    championshipHTML = championships.map(champ => `
                        <div class="championship-item">
                            <div class="championship-season">${champ.season}</div>
                            <div class="championship-detail">Team: <b>${champ.team}</b></div>
                            <div class="championship-detail">Owner: <b>${champ.owner}</b></div>
                            <div class="championship-detail">
                                ${champ.draft_pick === 'FA' ? 'Pick: <b>Free Agent</b>' : `Pick: <b>#${champ.draft_pick}, round ${champ.round}</b>`}
                                ${champ.traded_from ? `<ul style='margin:2px 0 0 16px;padding:0;list-style-type:disc;'><li>via <b>${champ.traded_from}</b></li></ul>` : ''}
                            </div>
                        </div>
                    `).join('');
                }

                return `
                <div class="player-card" data-index="${index}">
                    ${player.championship_wins ? '<div class="championship-triangle" onclick="flipCard(event, this)"></div>' : ''}
                    <div class="player-card-inner">
                        <div class="player-card-front" onclick="showModalByIndex(${index})">
                            <div class="player-header">
                                ${player.player_id || player.name === 'Will Smith' ? 
                                    `<img src="${getPlayerHeadshot(player)}" 
                                         class="player-headshot" 
                                         alt="${player.name}"
                                         loading="lazy"
                                         onerror="this.style.display='none'">` 
                                    : ''}
                                <div class="player-info">
                                    <div class="player-name">${player.name}</div>
                                    <div class="player-team">
                                        ${getTeamLogo(player.team) ? 
                                            `<img src="${getTeamLogo(player.team)}" class="team-logo" alt="${player.team}" loading="lazy">` 
                                            : ''}
                                        ${player.team || 'Unknown'}
                                        ${player.position && player.position.length > 0 ? `<span style="margin-left:8px;color:#7c3aed;font-weight:600;font-size:12px;">(${player.position.join(', ')})</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="player-stats">
                                <div class="stat-item">
                                    <span class="stat-label">Drafts</span>
                                    <span class="stat-value">${player.total_drafts}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Owners</span>
                                    <span class="stat-value">${player.unique_owners}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Wins</span>
                                    <span class="stat-value">${player.championship_wins ? player.championship_wins : 0}</span>
                                </div>
                            </div>
                        </div>
                        <div class="player-card-back" onclick="flipCard(event, this.parentElement.parentElement.querySelector('.championship-triangle'))">
                            <div class="player-header">
                                ${player.player_id || player.name === 'Will Smith' ? 
                                    `<img src="${getPlayerHeadshot(player)}" 
                                         class="player-headshot" 
                                         alt="${player.name}"
                                         loading="lazy"
                                         onerror="this.style.display='none'">` 
                                    : ''}
                                <div class="player-info">
                                    <div class="player-name">${player.name}</div>
                                    <div class="player-team">
                                        ${getTeamLogo(player.team) ? 
                                            `<img src="${getTeamLogo(player.team)}" class="team-logo" alt="${player.team}" loading="lazy">` 
                                            : ''}
                                        ${player.team || 'Unknown'}
                                    </div>
                                </div>
                            </div>
                            <div class="championship-back-title">🏆 Championship Wins</div>
                            <div class="championship-list">
                                ${championshipHTML || '<div class="championship-detail">No championships yet</div>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
            
            // Move children from tempDiv to fragment
            while (tempDiv.firstChild) {
                fragment.appendChild(tempDiv.firstChild);
            }
            
            // Clear and append in one operation
            grid.innerHTML = '';
            grid.appendChild(fragment);
        }

        // Card flip functionality
        function flipCard(event, triangleElement) {
            event.stopPropagation();
            const card = triangleElement.closest('.player-card');
            if (card) {
                const cardInner = card.querySelector('.player-card-inner');
                const isFlipping = !card.classList.contains('flipped');
                
                if (isFlipping) {
                    // Flipping to back - get current front height, then switch
                    const frontSide = card.querySelector('.player-card-front');
                    const currentHeight = frontSide.offsetHeight;
                    
                    // Set the card height to current before flip
                    cardInner.style.height = currentHeight + 'px';
                    
                    card.classList.add('flipped');
                    
                    // After flip, measure back and animate to that height
                    setTimeout(() => {
                        const backSide = card.querySelector('.player-card-back');
                        if (backSide) {
                            const backHeight = backSide.scrollHeight;
                            cardInner.style.height = backHeight + 'px';
                        }
                    }, 300);
                } else {
                    // Flipping back to front
                    card.classList.remove('flipped');
                    
                    // After flip, measure front and set height
                    setTimeout(() => {
                        const frontSide = card.querySelector('.player-card-front');
                        if (frontSide) {
                            cardInner.style.height = frontSide.offsetHeight + 'px';
                            // Remove inline height after transition to allow natural sizing
                            setTimeout(() => {
                                cardInner.style.height = '';
                            }, 300);
                        }
                    }, 300);
                }
            }
        }

        // Modal functionality
        let currentModalPlayer = null;
        let currentImageIndex = 0;
        let modalImages = [];

        function getPlayerImagePaths(playerName) {
            // Convert player name to match pie, gantt, and draft filename formats
            const pieFormat = playerName.toLowerCase().replace(/ /g, '_');
            const ganttFormat = playerName.replace(/ /g, '_');
            const draftFormat = playerName.replace(/ /g, '_');
            
            return [
                `images/pie/${pieFormat}_ownership.png`,
                `images/gantt/${ganttFormat}_gantt.png`,
                `images/draft-line/${draftFormat}_draft_position.png`
            ];
        }

        function showModalByIndex(index) {
            const player = filteredPlayers[index];
            if (player) {
                currentModalPlayer = player;
                modalImages = getPlayerImagePaths(player.name);
                currentImageIndex = 0;
                showModalImage();
            }
        }

        function showModalImage() {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            
            // Show modal immediately
            modal.classList.add('active');
            
            // Set initial image path immediately
            modalImage.src = modalImages[currentImageIndex];
            modalImage.alt = currentModalPlayer.name;
            updateIndicators();
            
            // Check if image fails to load and fallback to placeholder
            modalImage.onerror = function() {
                if (currentImageIndex === 0) {
                    modalImage.src = 'images/pie/placeholder.png';
                }
            };
        }

        function updateIndicators() {
            const dots = document.querySelectorAll('.indicator-dot');
            dots.forEach((dot, index) => {
                if (index === currentImageIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function navigateImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = modalImages.length - 1;
            if (currentImageIndex >= modalImages.length) currentImageIndex = 0;
            
            const modalImage = document.getElementById('modalImage');
            modalImage.style.opacity = '0';
            setTimeout(() => {
                modalImage.src = modalImages[currentImageIndex];
                modalImage.style.opacity = '1';
                updateIndicators();
                
                // Fallback to placeholder if pie chart fails
                modalImage.onerror = function() {
                    if (currentImageIndex === 0) {
                        modalImage.src = 'images/pie/placeholder.png';
                        modalImage.style.opacity = '1';
                    }
                };
            }, 150);
        }

        // Navigation button event listeners
        document.getElementById('prevImage').addEventListener('click', (e) => {
            e.stopPropagation();
            navigateImage(-1);
        });

        document.getElementById('nextImage').addEventListener('click', (e) => {
            e.stopPropagation();
            navigateImage(1);
        });

        // Indicator dots click handler
        document.getElementById('imageIndicator').addEventListener('click', (e) => {
            if (e.target.classList.contains('indicator-dot')) {
                const index = parseInt(e.target.dataset.index);
                currentImageIndex = index;
                const modalImage = document.getElementById('modalImage');
                modalImage.style.opacity = '0';
                setTimeout(() => {
                    modalImage.src = modalImages[currentImageIndex];
                    modalImage.style.opacity = '1';
                    updateIndicators();
                    
                    // Fallback to placeholder if pie chart fails
                    modalImage.onerror = function() {
                        if (currentImageIndex === 0) {
                            modalImage.src = 'images/pie/placeholder.png';
                            modalImage.style.opacity = '1';
                        }
                    };
                }, 150);
            }
        });

        // Swipe gesture support


        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('modal');
            if (modal.classList.contains('active')) {
                if (e.key === 'Escape') {
                    modal.classList.remove('active');
                } else if (e.key === 'ArrowLeft') {
                    navigateImage(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateImage(1);
                }
            }
        });
    </script>
</body>
</html>
